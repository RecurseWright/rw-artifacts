<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RecurseWright Artifact 1 - Group Booking (Polish v4)</title>
<style>
  :root {
    color-scheme: light;
    --page: #ece9e2;
    --paper: #fffdf9;
    --ink: #171713;
    --text: #39362f;
    --muted: #59544b;
    --line: #d9d3c9;
    --line-strong: #a9a197;
    --gold: #b37b11;
    --gold-dark: #7a5109;
    --indigo: #3345a2;
    --radius: 14px;
    --serif: Georgia, "Times New Roman", serif;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); }
  body { font-family: var(--sans); padding: 18px; }

  .scene {
    width: min(100%, 860px);
    margin: 0 auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 14px 34px rgba(43, 38, 29, .07), 0 2px 5px rgba(43, 38, 29, .04);
    overflow: clip;
  }

  .stage {
    padding: clamp(18px, 3.5vw, 26px) clamp(26px, 5vw, 48px) clamp(24px, 4vw, 34px);
  }

  .hero {
    margin: 0 0 20px;
    padding: 0 0 14px;
    border-bottom: 1.5px solid rgba(179, 123, 17, .46);
  }

  .eyebrow {
    margin: 0 0 10px;
    font: 600 12px/1.3 var(--mono);
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #403b34;
  }

  .lead {
    margin: 0;
    max-width: 560px;
    font-size: 17px;
    line-height: 1.45;
    color: var(--text);
  }

  .boundary-block { margin: 0; }

  .boundary-copy {
    margin: 0 0 9px;
    font-size: 17px;
    line-height: 1.45;
    color: var(--muted);
  }

  .question {
    margin: 0;
    max-width: 690px;
    font: 400 clamp(23px, 3.45vw, 32px)/1.13 var(--serif);
    letter-spacing: -.016em;
    text-wrap: balance;
  }

  .assumption {
    margin: 20px 0 0;
    padding: 10px 0 10px 16px;
    border-left: 2px solid rgba(179, 123, 17, .9);
    font-size: 17px;
    line-height: 1.5;
    color: var(--text);
  }
  .assumption strong { font-weight: 600; color: var(--ink); }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1.18fr .78fr;
    gap: 10px;
    margin-top: 26px;
  }

  .action {
    appearance: none;
    min-height: 48px;
    padding: 10px 14px;
    border: 1px solid #afa799;
    border-radius: 8px;
    background: #fffefa;
    color: #23211d;
    font: 600 13px/1.2 var(--sans);
    letter-spacing: .035em;
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(43, 38, 29, .04);
    transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
  }
  .action:hover {
    border-color: rgba(51, 69, 162, .72);
    background: #fcfbf7;
    box-shadow: 0 4px 12px rgba(43, 38, 29, .08);
    transform: translateY(-1px);
  }
  .action:focus-visible {
    outline: 3px solid rgba(51, 69, 162, .18);
    outline-offset: 3px;
    border-color: var(--indigo);
  }
  .action:active {
    transform: translateY(0);
    background: #f5f1ea;
    box-shadow: inset 0 1px 2px rgba(43, 38, 29, .09);
  }
  .action[disabled] { cursor: default; opacity: .72; transform: none; box-shadow: none; }

  .surface-enter { animation: surface-enter 620ms cubic-bezier(.16,.72,.24,1) both; }

  .result-head {
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }

  .decision-line {
    margin: 0 0 18px;
    font: 400 clamp(25px, 3.5vw, 34px)/1.15 var(--serif);
    letter-spacing: -.016em;
    text-wrap: balance;
  }

  .clarification {
    margin: 0;
    padding: 14px 0 14px 16px;
    border-left: 2px solid #8f8a80;
  }

  .clarification-label {
    margin: 0 0 7px;
    font: 600 11px/1.35 var(--mono);
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--gold-dark);
  }

  .clarification-text {
    margin: 0;
    font: 400 clamp(24px, 3.3vw, 32px)/1.16 var(--serif);
    letter-spacing: -.014em;
    text-wrap: balance;
  }

  /* One causal beat at a time. The region reserves the height of the
     tallest beat in the sequence, so CONTINUE never moves the card. */
  .beat-stage {
    position: relative;
    margin-top: 4px;
  }

  .work-row {
    padding: 22px 0 4px;
  }

  .work-row.changed {
    margin-top: 18px;
    padding: 4px 0 4px 14px;
    border-left: 2px solid rgba(179, 123, 17, .78);
  }

  .work-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .work-title { font-size: 17px; line-height: 1.35; font-weight: 600; }
  .status {
    font: 600 12px/1.3 var(--mono);
    letter-spacing: .085em;
    text-transform: uppercase;
    color: var(--gold-dark);
  }
  .work-copy { margin: 0; max-width: 640px; font-size: 16.5px; line-height: 1.5; color: var(--text); }

  .beat-in { animation: beat-in 460ms cubic-bezier(.16,.72,.24,1) both; }
  .beat-out { animation: beat-out 230ms ease both; }

  .beat-controls {
    display: flex;
    justify-content: flex-end;
    margin-top: 22px;
  }

  .quiet {
    appearance: none;
    min-height: 42px;
    padding: 9px 16px;
    border: 1px solid #b8b0a3;
    border-radius: 8px;
    background: #fffefa;
    color: #3b3731;
    font: 600 13px/1.2 var(--sans);
    letter-spacing: .05em;
    cursor: pointer;
    transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease, color 180ms ease, transform 180ms ease;
  }
  .quiet:hover { border-color: rgba(51,69,162,.64); background: #fcfbf7; color: var(--ink); box-shadow: 0 4px 10px rgba(43,38,29,.07); transform: translateY(-1px); }
  .quiet:focus-visible { outline: 3px solid rgba(51,69,162,.18); outline-offset: 3px; border-color: var(--indigo); }
  .quiet:active { transform: translateY(0); background: #f5f1ea; }

  @keyframes surface-enter {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes beat-in {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes beat-out {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-4px); }
  }

  @media (max-width: 560px) {
    body { padding: 8px; }
    .scene { border-radius: 10px; }
    .stage { padding: 18px 18px 22px; }
    .hero { margin-bottom: 17px; padding-bottom: 12px; }
    .eyebrow { font-size: 11px; margin-bottom: 8px; }
    .lead { font-size: 16px; }
    .boundary-copy { font-size: 16px; }
    .question { font-size: clamp(21px, 7vw, 27px); }
    .assumption { margin-top: 18px; font-size: 16px; padding-left: 14px; }
    .actions { grid-template-columns: 1fr; gap: 9px; margin-top: 24px; }
    .action { min-height: 47px; font-size: 12.5px; }
    .decision-line { font-size: clamp(24px, 7.5vw, 30px); margin-bottom: 16px; }
    .clarification { padding: 12px 0 13px 12px; }
    .clarification-text { font-size: clamp(22px, 7.4vw, 28px); }
    .work-row.changed { margin-top: 16px; padding-left: 12px; }
    .work-title { font-size: 16px; }
    .status { font-size: 11px; }
    .work-copy { font-size: 16px; }
    .quiet { min-height: 46px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important;
      animation-delay: 0ms !important;
      transition-duration: 1ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<main class="scene" id="scene" aria-live="polite">
  <section class="stage" id="stage"></section>
</main>
<script>
(() => {
  const stage = document.getElementById('stage');
  const scene = document.getElementById('scene');
  let path = null;
  let timers = [];
  let beatIndex = 0;
  let currentBeats = null;

  const PATHS = {
    assume: {
      decision: 'You proceed on the assumption.',
      changed: [
        ['Group booking rules', 'RECONSIDER', 'A participant may leave without cancelling the group.'],
        ['Seat release & waitlist', 'RECONSIDER', 'A single seat may now become vacant while the group remains active.'],
        ['Cancellation & refunds', 'AFFECTED', 'The existing cancellation rule assumed no partial exits.']
      ]
    },
    clarify: {
      decision: 'You ask first. The rule is held until the answer arrives.',
      changed: [
        ['Group booking rules', 'REVISED BEFORE COMMIT', 'A participant may leave without cancelling the group.'],
        ['Seat release & waitlist', 'READY', 'Can now be written against the clarified rule. Nothing to redo.'],
        ['Cancellation & refunds', 'AFFECTED', 'The existing cancellation rule assumed no partial exits.']
      ]
    },
    defer: {
      decision: 'You defer. The rule stays open, and nothing is built on it yet.',
      changed: [
        ['Group booking rules', 'RESOLVED', 'A participant may leave without cancelling the group.'],
        ['Seat release & waitlist', 'READY', 'Can start now. Nothing to redo.'],
        ['Cancellation & refunds', 'AFFECTED', 'The existing cancellation rule assumed no partial exits.']
      ]
    }
  };

  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
  }

  function initialMarkup() {
    return `
      <div class="surface-enter">
        <header class="hero">
          <p class="eyebrow">GROUP BOOKING · DAY 9</p>
          <p class="lead">Group booking is a single reservation made for several people.</p>
        </header>
        <div class="boundary-block">
          <p class="boundary-copy">One rule still needs a decision before the next build step.</p>
          <h1 class="question">Can one participant leave without cancelling the group?</h1>
          <p class="assumption">Current working assumption: <strong>leaving cancels the whole group.</strong></p>
          <div class="actions" role="group" aria-label="Choose how to proceed">
            <button class="action" data-path="clarify">CLARIFY NOW</button>
            <button class="action" data-path="assume">PROCEED ON ASSUMPTION</button>
            <button class="action" data-path="defer">DEFER</button>
          </div>
        </div>
      </div>`;
  }

  function reset() {
    clearTimers();
    path = null;
    currentBeats = null;
    stage.innerHTML = initialMarkup();
    stage.querySelectorAll('[data-path]').forEach(btn => btn.addEventListener('click', choose));
    reportHeight();
  }

  function choose(event) {
    if (path) return;
    path = event.currentTarget.dataset.path;
    renderResult(path);
  }

  function beatMarkup(item) {
    return `
      <div class="work-row changed">
        <div class="work-head">
          <div class="work-title">${item[0]}</div>
          <div class="status">${item[1]}</div>
        </div>
        <p class="work-copy">${item[2]}</p>
      </div>`;
  }

  function resultMarkup(which) {
    const p = PATHS[which];
    return `
      <div class="surface-enter">
        <section class="result-head">
          <p class="eyebrow">GROUP BOOKING · DAY 14</p>
          <h2 class="decision-line">${p.decision}</h2>
          <div class="clarification">
            <p class="clarification-label">DAY 14 · CLARIFICATION</p>
            <p class="clarification-text">A participant may leave without cancelling the group.</p>
          </div>
        </section>
        <div class="beat-stage" id="beatStage"></div>
        <div class="beat-controls" id="beatControls">
          <button class="quiet" type="button" id="continueBtn">CONTINUE</button>
          <button class="quiet" type="button" id="restartBtn" hidden>Start again</button>
        </div>
      </div>`;
  }

  // Reserve the height of the tallest beat so the frame never jumps.
  function reserveHeight(container, markups) {
    const probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;left:0;right:0;top:0;visibility:hidden;pointer-events:none;';
    container.appendChild(probe);
    let max = 0;
    markups.forEach(m => {
      probe.innerHTML = m;
      max = Math.max(max, probe.offsetHeight);
    });
    probe.remove();
    container.style.minHeight = max + 'px';
  }

  function showBeat(index, animate) {
    const beatStage = document.getElementById('beatStage');
    const continueBtn = document.getElementById('continueBtn');
    const restartBtn = document.getElementById('restartBtn');
    if (!beatStage) return;
    beatIndex = index;

    const render = () => {
      beatStage.innerHTML = beatMarkup(currentBeats[index]);
      if (animate && !reduced()) beatStage.firstElementChild.classList.add('beat-in');
      const last = index === currentBeats.length - 1;
      continueBtn.hidden = last;
      restartBtn.hidden = !last;
      if (last && document.activeElement === document.body || last && continueBtn === document.activeElement) {
        restartBtn.focus({ preventScroll: true });
      }
      reportHeight();
    };

    const outgoing = beatStage.firstElementChild;
    if (animate && !reduced() && outgoing) {
      outgoing.classList.remove('beat-in');
      outgoing.classList.add('beat-out');
      const t = setTimeout(render, 230);
      timers.push(t);
    } else {
      render();
    }
  }

  function renderResult(which) {
    clearTimers();
    const p = PATHS[which];
    currentBeats = p.changed;
    stage.innerHTML = resultMarkup(which);

    const beatStage = document.getElementById('beatStage');
    reserveHeight(beatStage, currentBeats.map(beatMarkup));

    document.getElementById('continueBtn').addEventListener('click', () => {
      if (beatIndex < currentBeats.length - 1) showBeat(beatIndex + 1, true);
    });
    document.getElementById('restartBtn').addEventListener('click', reset);

    reportHeight();

    // First consequence arrives on its own, a moment after the clarification.
    const firstDelay = reduced() ? 0 : 520;
    const t = setTimeout(() => showBeat(0, true), firstDelay);
    timers.push(t);
  }

  function reportHeight() {
    requestAnimationFrame(() => {
      const styles = getComputedStyle(document.body);
      const verticalPadding = (parseFloat(styles.paddingTop) || 0) + (parseFloat(styles.paddingBottom) || 0);
      const h = Math.ceil(scene.getBoundingClientRect().height + verticalPadding);
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'rwa:height', height: h }, '*');
      }
    });
  }

  let resizeT = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      const beatStage = document.getElementById('beatStage');
      if (beatStage && currentBeats) {
        beatStage.style.minHeight = '';
        reserveHeight(beatStage, currentBeats.map(beatMarkup));
        reportHeight();
      }
    }, 150);
  });

  new ResizeObserver(reportHeight).observe(scene);
  window.addEventListener('load', reportHeight);
  reset();
})();
</script>
</body>
</html>
