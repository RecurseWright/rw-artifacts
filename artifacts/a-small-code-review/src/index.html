<script>
'use strict';

/* ============================================================
   SCENARIO - all content lives here as data.
   Light walk -> quiet turn -> flip -> warm reveal -> encore.
   The second act is never announced up front.
   ============================================================ */
const SCENARIO = {

  /* Filled at publication day: article URL slot. null = block hidden. */
  meta: {
    articleUrl: 'https://rw.krupnyak.com/articles/experimental-recursewright-the-cube-that-doesnt-wait-for-a-command/',
    articleLinkText: 'This demo walks beside an article - read the whole story'
  },

  intro: {
    title: 'A Small Code Review',
    sub: 'Five tiny diffs from an <span class="italic text-copper-300 underline decoration-dotted decoration-copper-500 decoration-2 underline-offset-[7px]">ordinary</span> week.',
    notes: ['No signup. No AI. Your answers stay on this page.'],
    cta: 'Open the first diff'
  },

  tour: {
    lead: 'A tiny library app. This is the whole system:',
    files: [
      { name: 'catalog.js', code:
`export const books = [
  { id: 1, title: "Dune",    copiesTotal: 2, copiesOnLoan: 1 },
  { id: 2, title: "Solaris", copiesTotal: 1, copiesOnLoan: 1 },
];` },
      { name: 'search.js', code:
`// list screen: title + availability badge
export function searchResults(query) {
  return books
    .filter(b => b.title.toLowerCase().includes(query))
    .map(b => ({
      title: b.title,
      available: b.copiesTotal - b.copiesOnLoan > 0
    }));
}` },
      { name: 'details.js', code:
`// book page, same inline check
const available = book.copiesTotal - book.copiesOnLoan > 0;` },
      { name: 'loans.js', code:
`export function checkout(memberId, bookId) {
  findBook(bookId).copiesOnLoan += 1;
  return { ok: true };
}` }
    ],
    outro: 'Five small changes are coming in. Review each one - it goes fast.',
    cta: 'First diff'
  },

  deltas: [
    {
      id: 1,
      ticket: 'Availability badge logic is duplicated in search and details. Extract a shared helper so the two screens can never disagree.',
      diff: [
        { f: 'catalog.js' },
        { a: 'export function isAvailable(book) {' },
        { a: '  return book.copiesOnLoan < book.copiesTotal;' },
        { a: '}' },
        { f: 'search.js' },
        { d: '  available: b.copiesTotal - b.copiesOnLoan > 0' },
        { a: '  available: isAvailable(b)' },
        { f: 'details.js' },
        { d: 'const available = book.copiesTotal - book.copiesOnLoan > 0;' },
        { a: 'const available = isAvailable(book);' }
      ],
      q: 'Can search and details disagree about availability now?',
      options: ['Yes, still possible', 'No - one helper now'],
      correct: 1,
      yes: 'Right. One source, no drift.',
      no: 'Actually no - both screens read the same helper now.'
    },
    {
      id: 2,
      ticket: 'Checkout must refuse when no copies are free.',
      diff: [
        { f: 'loans.js' },
        { c: 'export function checkout(memberId, bookId) {' },

/* ============================================================
   ENGINE - thin state machine + renderers. No content here.
   Nav chevrons from the author mark; dashed copper timeline;
   prompt-chevron options; two-page reveal; looped intro typing.
   ============================================================ */
const state = {
  screen: 'intro',      // intro | tour | delta | turn | reveal | takeaway
  deltaIdx: 0,
  answers: [null, null, null, null, null],
  turnA: null,
  turnB: null,
  encoreOpen: false,
  encorePicked: null
};

const app = document.getElementById('app');

/* Author mark (Michael Krupnyak, GitHub profile logo). The right chevron doubles as a terminal prompt. */
function logoSvg(size) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100" role="img" aria-label="Michael Krupnyak">' +
    '<defs><clipPath id="lg"><circle cx="50" cy="50" r="48"/></clipPath></defs>' +
    '<g clip-path="url(#lg)">' +
    '<rect width="100" height="100" fill="#1E293B"/>' +
    '<polygon points="58,0 100,0 100,100 42,100" fill="#2A3A54"/>' +
    '<path d="M40 26 L18 50 L40 74" stroke="#B87333" stroke-width="13" fill="none"/>' +
    '<path d="M60 26 L82 50 L60 74" stroke="#B87333" stroke-width="13" fill="none"/>' +
    '<circle cx="50" cy="50" r="12" fill="#B87333"/>' +
    '<rect x="30" y="45" width="40" height="10" fill="#B87333"/>' +
    '</g></svg>';
}

/* A single chevron in the mark's geometry: nav arrows and answer prompts reuse it. */
function chev(dir, size) {
  const d = dir === 'l' ? 'M28 8 L10 30 L28 52' : 'M12 8 L30 30 L12 52';
  return '<svg width="' + size + '" height="' + Math.round(size * 1.5) + '" viewBox="0 0 40 60" fill="none" aria-hidden="true">' +
    '<path d="' + d + '" stroke="#B87333" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

const pchev = '<span class="pchev absolute left-3 top-1/2 -translate-y-1/2">' + chev('r', 9) + '</span>';

const ICON_COPY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const ICON_CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6FBF73" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

/* Looped, unhurried intro typing: type -> hold -> erase -> retype. */
let typeTimer = null;
function typeLine(elId, text, speed, loop) {
  clearTimeout(typeTimer);
  if (!document.getElementById(elId)) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.getElementById(elId).textContent = text; return;
  }
  let i = 0, phase = 'type';
  const tick = () => {
    const node = document.getElementById(elId);
    if (!node) return; // screen changed
    if (phase === 'type') {
      node.textContent = text.slice(0, ++i);
      if (i >= text.length) {
        if (!loop) return; // one-shot line keeps its caret blinking
        phase = 'hold'; typeTimer = setTimeout(tick, 4200); return;
      }
      typeTimer = setTimeout(tick, speed);
    } else if (phase === 'hold') {
      phase = 'erase'; typeTimer = setTimeout(tick, 0);
    } else {
      node.textContent = text.slice(0, --i);
      if (i <= 0) { phase = 'type'; typeTimer = setTimeout(tick, 800); return; }
      typeTimer = setTimeout(tick, 24);
    }
  };
  typeTimer = setTimeout(tick, 450);
}

function localCorrect() {
  return state.answers.filter((a, i) => a === SCENARIO.deltas[i].correct).length;
}

/* ---------- navigation ---------- */

function canPrev() { return state.screen !== 'intro'; }
function canNext() {
  if (state.screen === 'tour') return true;
  if (state.screen === 'delta') return state.answers[state.deltaIdx] !== null;
  if (state.screen === 'turn') return state.turnA !== null && state.turnB !== null;
  return false;
}

window.navPrev = () => {
  if (!canPrev()) return;
  if (state.screen === 'tour') go('intro');
  else if (state.screen === 'delta') {
    if (state.deltaIdx > 0) { state.deltaIdx--; go('delta'); } else go('tour');
  }
  else if (state.screen === 'turn') { state.deltaIdx = 4; go('delta'); }
  else if (state.screen === 'reveal') go('turn');
  else if (state.screen === 'takeaway') go('reveal');
};

window.navNext = () => {
  if (!canNext()) return;
  if (state.screen === 'tour') go('delta');
  else if (state.screen === 'delta') {
    if (state.deltaIdx < 4) { state.deltaIdx++; go('delta'); } else go('turn');
  }
  else if (state.screen === 'turn') go('reveal');
};

/* Dashed copper quasi-timeline: 5 diff ticks + the turn. The reveal lives off the map. */
function tlPos() {
  if (state.screen === 'delta') return state.deltaIdx;
  if (state.screen === 'turn') return 5;
  return -1;
}

function timeline() {
  const pos = tlPos();
  const pct = pos < 0 ? 0 : (pos / 5) * 100;
  let ticks = '';
  for (let i = 0; i < 6; i++) {
    const left = (i / 5) * 100;
    let cls;
    if (i === pos) cls = 'w-2.5 h-2.5 bg-copper-300 shadow-[0_0_10px_rgba(216,147,79,0.7)]';
    else if (pos > -1 && i < pos) cls = 'w-1.5 h-1.5 bg-copper-500';
    else cls = 'w-1.5 h-1.5 bg-navy-750 border border-white/10';
    ticks += '<span class="absolute top-1/2 -translate-x-1/2 -translate-y-1/2 rounded-full ' + cls + '" style="left:' + left + '%"></span>';
  }
  return '<div class="relative h-8 flex-1 mx-1">' +
    '<div class="absolute top-1/2 -translate-y-1/2 left-0 right-0 h-px" style="background-image:repeating-linear-gradient(90deg,rgba(42,58,84,0.55) 0 5px,transparent 5px 11px)"></div>' +
    '<div class="absolute top-1/2 -translate-y-1/2 left-0 h-px bg-gradient-to-r from-copper-500/80 to-copper-300/80" style="width:' + pct + '%"></div>' +
    ticks + '</div>';
}

function navRow() {
  const prev = canPrev(), next = canNext();
  return '<div class="flex items-center gap-2 mb-8">' +
    '<button onclick="navPrev()" ' + (prev ? '' : 'disabled') +
    ' class="nav-ch l rip r1 shrink-0 px-2 py-1.5" aria-label="Back">' + chev('l', 13) + '</button>' +
    timeline() +
    '<button onclick="navNext()" ' + (next ? '' : 'disabled') +
    ' class="nav-ch r rip r2 shrink-0 px-2 py-1.5" aria-label="Forward">' + chev('r', 13) + '</button>' +
    '</div>';
}

/* Reveal pages carry no timeline - only a quiet way back. */
function backRow() {
  return '<div class="mb-6 -ml-2"><button onclick="navPrev()" class="nav-ch l rip r1 px-2 py-1.5" aria-label="Back">' + chev('l', 13) + '</button></div>';
}

/* ---------- shared blocks ---------- */

/* Sunken (pressed-in) surface for all code: inset shadow + hairline. */
const SUNKEN = 'sunken';

function codeBlock(name, code) {
  return '<div class="mb-3">' +
    '<div class="text-xs font-mono text-slate-400 mb-1">' + name + '</div>' +
    '<pre class="' + SUNKEN + ' p-3 overflow-x-auto text-[13px] leading-relaxed font-mono text-slate-300">' +
    code.replace(/</g, '&lt;') + '</pre></div>';
}

function diffBlock(diff) {
  const rows = diff.map(line => {
    if (line.f) return '<div class="font-mono text-xs text-slate-400 pt-2 pb-1">' + line.f + '</div>';
    if (line.a) return '<div class="font-mono text-[13px] leading-relaxed px-2 rounded bg-emerald-500/10 text-emerald-300 whitespace-pre">+ ' + line.a.replace(/</g, '&lt;') + '</div>';
    if (line.d) return '<div class="font-mono text-[13px] leading-relaxed px-2 rounded bg-rose-500/10 text-rose-300 whitespace-pre">- ' + line.d.replace(/</g, '&lt;') + '</div>';
    return '<div class="font-mono text-[13px] leading-relaxed px-2 text-slate-400 whitespace-pre">  ' + line.c.replace(/</g, '&lt;') + '</div>';
  }).join('');
  return '<div class="' + SUNKEN + ' p-3 overflow-x-auto">' + rows + '</div>';
}

function ciChip() {
  return '<span class="inline-flex items-center gap-1.5 text-xs text-emerald-300 border border-emerald-500/30 rounded-full px-2.5 py-0.5">' +
    '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>CI: green</span>';
}

function button(label, action, extra) {
  return '<button onclick="' + action + '" class="rip r2 ' + (extra || '') +
    ' bg-copper-500 hover:bg-copper-300 hover:-translate-y-0.5 hover:shadow-[0_8px_24px_-8px_#B87333] text-white font-semibold rounded-[10px] px-[22px] py-3 transition-all">' +
    label + '</button>';
}

/* Sequentially surfacing sentences: each fades in on its own delay. */
function fadeSeq(text) {
  const parts = text.split('. ').map((p, i, arr) => p.endsWith('.') || i === arr.length - 1 ? p : p + '.');
  return parts.map((p, i) =>
    '<span class="fseq" style="animation-delay:' + (0.25 + i * 0.85).toFixed(2) + 's">' + p + ' </span>').join('');
}

    inner = '<div class="border-l-2 border-copper-400 pl-4 py-1.5">' +
      '<div class="font-mono text-sm text-inkdim mb-1">you: ' + e.options[picked] + '</div>' +
      '<p class="text-[15px] text-slate-300">' + (picked === e.correct ? e.right : e.wrong) +
      ' <span class="text-copper-300">' + e.tail + '</span></p></div>';
  }
  return '<div class="bg-navy-800 rounded-xl p-4 mb-8">' +
    '<p class="text-ink mb-3">' + e.q + '</p>' + inner + '</div>';
}

function renderTakeaway() {
  const tw = SCENARIO.takeaway;
  const t = SCENARIO.turn;
  const n = (state.turnA === t.qaCorrect ? 1 : 0) + (state.turnB === t.qbCorrect ? 1 : 0);
  const local = localCorrect();

  const questions = tw.questions.map((q, i) =>
    '<div class="flex gap-3 py-2">' +
    '<span class="font-mono text-copper-300 text-sm pt-0.5">0' + (i + 1) + '</span>' +
    '<p class="text-slate-200">' + q + '</p></div>').join('');

  app.innerHTML = backRow() +
    '<h2 class="font-serif text-3xl font-semibold tracking-[-0.015em] text-ink mb-5">' + tw.title + '</h2>' +
    '<div class="bg-navy-750 border-l-2 border-copper-400 rounded-r-lg px-5 py-3 mb-8">' + questions + '</div>' +
    '<p class="text-sm text-slate-400 italic mb-8">' + tw.ciLine + '</p>' +
    '<div class="w-10 h-px bg-copper-400 mx-auto mt-10 mb-6"></div>' +
    '<div class="flex items-start justify-center gap-2.5 max-w-md mx-auto mb-10">' + logoSvg(22) +
    '<span class="font-mono text-[12px] leading-relaxed tracking-[0.04em] text-slate-300 text-left"><span id="typedAi"></span><span class="caret align-text-bottom"></span></span></div>' +
    encoreBlock() +
    '<div class="bg-navy-800 rounded-xl p-5">' +
    '<div class="text-xs uppercase tracking-widest text-copper-300 mb-3">Your result</div>' +
    '<div class="sunken px-4 py-3 flex items-start gap-3">' +
    '<span class="font-mono text-sm text-slate-300 flex-1 overflow-x-auto">' + SCENARIO.share.line(local, n).replace(/</g, '&lt;') + '</span>' +
    '<button onclick="copyShare(this)" class="tip rip r2 shrink-0 text-slate-400 hover:text-copper-300 transition-colors p-1 -m-1" data-tip="Copy your result" aria-label="Copy your result">' + ICON_COPY + '</button>' +
    '</div>' +
    (SCENARIO.meta.articleUrl ? '<p class="text-sm mt-4"><a href="' + SCENARIO.meta.articleUrl + '" class="text-copper-300 underline decoration-dotted decoration-copper-500 underline-offset-4">' + SCENARIO.meta.articleLinkText + '</a></p>' : '') +
    '</div>' +
    '<div class="text-center mt-7"><button onclick="restart()" class="rip r1 text-slate-300 hover:text-copper-300 underline decoration-dotted decoration-copper-500/70 underline-offset-4 transition-colors">Run it again</button></div>' +
    '<p class="text-xs text-slate-600 mt-8 text-center">Synthetic system, analogous by mechanism &middot; Your answers stay on this page.</p>' +
    '<p class="text-xs text-slate-600 mt-1.5 text-center">&copy; 2026 Michael Krupnyak &middot; <a href="https://dev.to/coderivet" class="hover:text-copper-300">coderivet</a></p>';
  typeLine('typedAi', tw.aiLine, 42, false);
}

/* ---------- actions ---------- */

window.go = screen => { clearTimeout(typeTimer); state.screen = screen; pageAnim = true; render(); window.scrollTo(0, 0); };

window.pickDelta = i => {
  if (state.answers[state.deltaIdx] !== null) return;
  state.answers[state.deltaIdx] = i;
  render();
};

window.pickTurn = (group, i) => {
  if (group === 'a') state.turnA = i; else state.turnB = i;
  render();
};

window.openEncore = () => { state.encoreOpen = true; render(); };
window.pickEncore = i => { if (state.encorePicked === null) { state.encorePicked = i; render(); } };

window.copyShare = btn => {
  const t = SCENARIO.turn;
  const n = (state.turnA === t.qaCorrect ? 1 : 0) + (state.turnB === t.qbCorrect ? 1 : 0);
  const text = SCENARIO.share.line(localCorrect(), n);
  const ok = () => {
    btn.innerHTML = ICON_CHECK; btn.dataset.tip = 'Copied!';
    setTimeout(() => { btn.innerHTML = ICON_COPY; btn.dataset.tip = 'Copy your result'; }, 1600);
  };
  /* Clipboard API needs a permissive context (often absent in iframes / file://).
     Fall back to the legacy textarea trick so feedback never silently dies. */
  const legacy = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let done = false;
    try { done = document.execCommand('copy'); } catch (e) { /* ignore */ }
    ta.remove();
    return done;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok).catch(() => { if (legacy()) ok(); });
  } else if (legacy()) ok();
};

window.restart = () => {
  Object.assign(state, { screen: 'intro', deltaIdx: 0, answers: [null, null, null, null, null],
    turnA: null, turnB: null, encoreOpen: false, encorePicked: null });
  render(); window.scrollTo(0, 0);
};

/* Water ripples: delegated, so re-rendered screens keep working. */
const water = document.getElementById('water');
let ripTimer = null, ripEl = null, ripFlip = 0;
function spawnRipple(x, y, tilt) {
  x = Math.max(14, Math.min(window.innerWidth - 14, x));
  const rot = document.createElement('div');
  rot.className = 'wrot';
  rot.style.left = x + 'px';
  rot.style.top = y + 'px';
  rot.style.transform = 'rotate(' + (tilt || 0) + 'deg)';
  rot.innerHTML = '<div class="wripple"></div>';
  water.appendChild(rot);
  setTimeout(() => rot.remove(), 1950);
}
function stopRipples() { clearInterval(ripTimer); ripTimer = null; ripEl = null; }
document.addEventListener('mouseover', e => {
  const el = e.target.closest ? e.target.closest('.rip') : null;
  if (!el || el === ripEl || el.disabled) return;
  stopRipples();
  ripEl = el;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const burst = () => {
    if (!ripEl) return;
    const r = ripEl.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const jx = (Math.random() - 0.5) * 34, jy = (Math.random() - 0.5) * 26;
    const jr = (Math.random() - 0.5) * 24;
    if (ripEl.classList.contains('r3')) {
      spawnRipple(r.left - 70 + jx, cy + 22 + jy, -15 + jr);
      spawnRipple(r.right + 70 - jx, cy - 30 - jy, 15 + jr);
    } else {
      const base = ripEl.classList.contains('r2') ? 1 : 0;
      const dir = ((ripFlip++ + base) % 2 === 0) ? -1 : 1;
      spawnRipple(cx + dir * (r.width / 2 + 84) + jx, cy + (dir > 0 ? -32 : 26) + jy, dir * 15 + jr);
    }
  };
  burst();
  ripTimer = setInterval(burst, 950);
});
document.addEventListener('mouseout', e => {
  if (ripEl && (!e.relatedTarget || !ripEl.contains(e.relatedTarget)) && e.target.closest && e.target.closest('.rip') === ripEl) stopRipples();
});

/* ============================================================
   HOST ADAPTER - the one addition to the original engine. It does
   nothing when this page is opened on its own. In a frame it reports
   the scene's height, and works in either kind of host: one that
   sizes the frame to that height, and one with a fixed, shorter frame.
   ============================================================ */
if (window.parent !== window) {
  const post = message => window.parent.postMessage(message, '*');

  /* The scene's height, never the document's: body is min-h-screen, which in
     a frame is the frame's own height and could only ever grow. */
  const reportHeight = () => post({ type: 'rwa:height', height: app.offsetHeight });
  window.addEventListener('load', reportHeight);

  /* A frame that holds the scene has nothing of its own to scroll: no scrollbar
     when the entrance animation briefly overflows it. A frame that stays shorter
     than the scene, once a host has had time to answer, keeps native scrolling. */
  const root = document.documentElement;
  root.style.overflow = 'hidden';
  let settling;
  const fit = () => {
    clearTimeout(settling);
    if (innerHeight >= app.offsetHeight) root.style.overflow = 'hidden';
    else settling = setTimeout(() => { if (innerHeight < app.offsetHeight) root.style.overflow = ''; }, 400);
  };
  new ResizeObserver(() => { reportHeight(); fit(); }).observe(app);
  window.addEventListener('resize', fit);

  /* go() and restart() return to the top of the scene: in the frame's own
     scroll, and by asking a host that has sized the frame to do the same. */
  const scrollFrameTo = window.scrollTo.bind(window);
  window.scrollTo = (...position) => { scrollFrameTo(...position); post({ type: 'rwa:top' }); };

  /* In a sandbox a link can only navigate the frame itself, into pages that may
     refuse to be framed. The host page carries the article; here both the article
     block and the footer's link stand down. */
  SCENARIO.meta.articleUrl = null;
  new MutationObserver(() => app.querySelectorAll('a[href]').forEach(a => a.removeAttribute('href')))
    .observe(app, { childList: true, subtree: true });
}

let pageAnim = true; // first paint animates too
function render() {
  ({ intro: renderIntro, tour: renderTour, delta: renderDelta,
     turn: renderTurn, reveal: renderReveal, takeaway: renderTakeaway })[state.screen]();
  if (pageAnim) {
    pageAnim = false;
    app.classList.remove('page-in');
    void app.offsetWidth; // restart the entrance animation
    app.classList.add('page-in');
  }
}

render();
</script>
